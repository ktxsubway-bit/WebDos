# 이 파일을 저장소의 .github/workflows/zip-manifest.yml 로 넣으세요.
# zip/jsdos 를 push 하면 각 폴더에 files.json(zip 이름 목록)을 자동으로 만들어 커밋합니다.
# → WEB-DOS 에서 CD A 후 LOAD 만 입력하면 폴더 안의 모든 zip 을 불러옵니다.
name: zip manifest
on:
  push:
    paths:
      - '**/*.zip'
      - '**/*.jsdos'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write files.json in every folder that has zips
        run: |
          python3 - <<'PY'
          import os, json
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              z = sorted(f for f in files if f.lower().endswith(('.zip', '.jsdos')))
              if z:
                  with open(os.path.join(root, 'files.json'), 'w', encoding='utf-8') as fp:
                      json.dump(z, fp, ensure_ascii=False)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update files.json" && git push)
