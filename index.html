<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB-DOS [Version 1.02]</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; background: #000; }
        #t { height: 100%; overflow-y: auto; padding: 10px 14px; box-sizing: border-box; color: #aaa; font: 16px/1.3 "Perfect DOS VGA 437", "Consolas", "D2Coding", monospace; white-space: pre-wrap; word-break: break-all; }
        #t.drag { outline: 3px dashed #5f5; outline-offset: -6px; }
        #row { display: flex; }
        #in { flex: 1; background: none; border: 0; outline: 0; color: #fff; font: inherit; caret-color: #fff; padding: 0; }
        .err { color: #f66; }
        .ok { color: #5f5; }
        .hi { color: #fff; }
        .cyan { color: #5ff; }
        .yellow { color: #ff5; }
        #game { display: none; position: fixed; inset: 0; background: #000; z-index: 9; }
        #dos { position: absolute; inset: 0; }
        #x { position: absolute; top: 8px; right: 8px; z-index: 10; background: #a00; color: #fff; border: 0; padding: 6px 12px; font: 14px monospace; cursor: pointer; opacity: .85; }
        /* Editor Overlay Styles */
        #editor { display: none; position: fixed; inset: 20px; background: #000; border: 2px solid #5f5; z-index: 8; padding: 10px; flex-direction: column; box-sizing: border-box; }
        #editor-header { color: #5f5; font: bold 16px monospace; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        #editor-textarea { flex: 1; background: #111; color: #fff; border: 1px solid #333; font: 15px monospace; padding: 8px; resize: none; outline: none; }
        #editor-footer { color: #777; font-size: 13px; margin-top: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div id="t">
        <div id="o"></div>
        <div id="row"><span id="pr"></span><input id="in" autocomplete="off" spellcheck="false" autofocus></div>
    </div>
    
    <div id="editor">
        <div id="editor-header">WEB-DOS EDITOR</div>
        <textarea id="editor-textarea" spellcheck="false"></textarea>
        <div id="editor-footer">
            <span>[Ctrl+S] Save & Exit | [ESC] Cancel</span>
            <span id="editor-filename"></span>
        </div>
    </div>

    <div id="game">
        <button id="x">■ EXIT (ESC)</button>
        <div id="dos"></div>
    </div>
    <input type="file" id="fz" multiple accept=".zip,.jsdos,*" hidden>
    <input type="file" id="fd" webkitdirectory directory multiple hidden>

            // Auto detect browser / system language instantly
            (function detectBrowserLanguage() {
                try {
                    const navLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
                    if (navLang.startsWith('ko')) {
                        currentLang = 'kr';
                    } else if (navLang.startsWith('ja')) {
                        currentLang = 'jp';
                    } else if (navLang.startsWith('zh') || navLang.startsWith('cn') || navLang.startsWith('tw') || navLang.startsWith('hk')) {
                        currentLang = 'cn';
                    } else {
                        currentLang = 'en';
                    }
                } catch (e) {
                    currentLang = 'en';
                }

                if(!s && s!== '') return;

                    const d=document.createElement('div');

                    d.textContent=s;
                    O.appendChild(d);
                    T.scrollTop=T.scrollHeight;

            const addFile=(p,d)=>{const parts=p.split('/');parts.pop();if(parts.length)addDir(parts.join('/'));files.set(p.toLowerCase(),{p,d})};

            function playBeep(freq=800, duration=100) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    setTimeout(() => { try { osc.stop(); ctx.close(); } catch(e){} }, duration);
                } catch(e) {}
            }

                const e=document.createElement(css?'link':'script');

                e[css?'href':'src']=u;
                const timer=setTimeout(()=>no(new Error(u+i18n.en.timeout)),20000);
                e.onload=()=>{clearTimeout(timer);ok()};

                {n:'jsDelivr',js:'https://cdn.jsdelivr.net/npm/js-dos@8/dist/js-dos.js',css:'https://cdn.jsdelivr.net/npm/js-dos@8/dist/js-dos.css',pre:'https://cdn.jsdelivr.net/npm/emulators@8/dist/'}
            ];

            function ensureDos(){
                if(dosSrc && typeof window.Dos === 'function') return Promise.resolve(dosSrc);
                return dosP || (dosP = (async()=>{
                    const errs=[];
                    for(const s of SRC){
                        try{
                            await loadTag(s.css,true).catch(()=>{});
                            await loadTag(s.js);
                            if(typeof window.Dos !== 'function'){
                                try {
                                    const m = await import(s.js);
                                    const D = m.Dos || m.default;
                                    if(typeof D === 'function') window.Dos = D;
                                } catch(e) {}
                            }
                            if(typeof window.Dos !== 'function') throw new Error(s.n + ': ' + tr('dosNotFound'));
                            if(s.pre && window.emulators) window.emulators.pathPrefix = s.pre;
                            dosSrc = s; return s;
                        }catch(e){errs.push(e.message)}
                    }
                    dosP=null; throw new Error(errs.join('\n') || tr('dosNotFound'));
                })());
            }

            async function ingest(list){
                let n=0; const cp=cwd.join('/'), pre=cp?cp+'/':'';
                for(const f of list){
                    if(/\.(zip|jsdos)$/i.test(f.name)&&!f.webkitRelativePath){
                        const root=f.name.replace(/\.[^.]+$/,'');
                        try{
                            const z=await JSZip.loadAsync(f);
                            const ents=Object.values(z.files).filter(e=>!e.dir&&!/^__MACOSX\/|(^|\/)\.DS_Store$/.test(e.name));
                            const tops=new Set(ents.map(e=>e.name.split('/')[0]));
                            const strip=tops.size===1&&ents.every(e=>e.name.includes('/'));
                            for(const e of ents){let nm=e.name;if(strip)nm=nm.split('/').slice(1).join('/');addFile(pre+root+'/'+nm,await e.async('uint8array'));n++;}
                            out(`  ${f.name} → ${root}\\`+tr('zipUnpack'),'ok');
                        }catch(e){out(f.name+': '+tr('zipFail'),'err')}
                    }else{
                        const relPath = f.webkitRelativePath || f.name;
                        addFile(pre+relPath,new Uint8Array(await f.arrayBuffer())); n++;
                    }
                }
                out(`${n}`+tr('uploadComplete'),'ok');
            }

                    if(en.isFile) await new Promise(r=>en.file(f=>{Object.defineProperty(f,'webkitRelativePath',{value:path+f.name});all.push(f);r()}));
                    else{const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r));for(const c of b)await walk(c,path+en.name+'\/')}while(b.length)}
                };
                for(const it of e.dataTransfer.items){
                    const en=it.webkitGetAsEntry?.();
                    if(en?.isDirectory) await walk(en,'');
                    else if(en) await new Promise(r=>en.file(f=>{all.push(f);r()}))
                }
                ingest(all);
            };

            window.addEventListener('error', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.message || 'Script warning'), 'err');
                }
            });

            window.addEventListener('unhandledrejection', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.reason && e.reason.message || e.reason), 'err');
                }
            });

            ensureDos().catch(()=>{});
            T.onclick=()=>{if(!getSelection().toString() && $('editor').style.display !== 'flex')I.focus()};

            out(tr('intro1'),'hi');
            out(tr('intro2'));
            out('');
            prompt();
        })();
    </script>
</body>
