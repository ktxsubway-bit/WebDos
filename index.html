    <meta charset="utf-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; background: #000; }
        #t { height: 100%; overflow-y: auto; padding: 10px 14px; box-sizing: border-box; color: #aaa; font: 16px/1.3 "Perfect DOS VGA 437", "Consolas", "D2Coding", monospace; white-space: pre-wrap; word-break: break-all; }
        #t.drag { outline: 3px dashed #5f5; outline-offset: -6px; }
        #row { display: flex; }
        #in { flex: 1; background: none; border: 0; outline: 0; color: #fff; font: inherit; caret-color: #fff; padding: 0; }
        .err { color: #f66; }
        .ok { color: #5f5; }
        .hi { color: #fff; }
        .cyan { color: #5ff; }
        .yellow { color: #ff5; }
        #game { display: none; position: fixed; inset: 0; background: #000; z-index: 9; }
        #dos { position: absolute; inset: 0; }
        #x { position: absolute; top: 8px; right: 8px; z-index: 10; background: #a00; color: #fff; border: 0; padding: 6px 12px; font: 14px monospace; cursor: pointer; opacity: .85; }
        /* Editor Overlay Styles */
        #editor { display: none; position: fixed; inset: 20px; background: #000; border: 2px solid #5f5; z-index: 8; padding: 10px; flex-direction: column; box-sizing: border-box; }
        #editor-header { color: #5f5; font: bold 16px monospace; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        #editor-textarea { flex: 1; background: #111; color: #fff; border: 1px solid #333; font: 15px monospace; padding: 8px; resize: none; outline: none; }
        #editor-footer { color: #777; font-size: 13px; margin-top: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div id="t">
        <div id="o"></div>
        <div id="row"><span id="pr"></span><input id="in" autocomplete="off" spellcheck="false" autofocus></div>
    </div>
    
    <div id="editor">
        <div id="editor-header">WEB-DOS EDITOR</div>

        <div id="editor-footer">

            <span id="editor-filename"></span>
        </div>
    </div>

    <div id="game">
        <button id="x">■ EXIT (ESC)</button>
        <div id="dos"></div>
    </div>
    <input type="file" id="fz" multiple accept=".zip,.jsdos,*" hidden>
    <input type="file" id="fd" webkitdirectory directory multiple hidden>

            let currentLang = 'en';

            function updateUIForLanguage() {
                try {
                    $('editor-header').textContent = tr('editorTitle');

            (function detectBrowserLanguage() {
                try {
                    const navLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
                    if (navLang.startsWith('ko')) {
                        currentLang = 'kr';
                    } else if (navLang.startsWith('ja')) {
                        currentLang = 'jp';
                    } else if (navLang.startsWith('zh') || navLang.startsWith('cn') || navLang.startsWith('tw') || navLang.startsWith('hk')) {
                        currentLang = 'cn';
                    } else {
                        currentLang = 'en';
                    }
                } catch (e) {
                    currentLang = 'en';

            })();

            const out=(s='',c='')=>{
                if(!s && s!== '') return;

                    const d=document.createElement('div');

                    O.appendChild(d);

            const prompt=()=> { try { $('pr').textContent='C:\\'+cwd.join('\\').toUpperCase()+'>'; } catch(e){} };
            const resolve=s=>{let p=/^[\\/]/.test(s)?[]:[...cwd];for(const x of s.split(/[\\/]/)){if(!x||x==='.')continue;x==='..'?p.pop():p.push(x)}return p};
            const lc=p=>p.join('/').toLowerCase();
            const addDir=p=>{let a=p.split('/');for(let i=1;i<=a.length;i++)dirs.add(a.slice(0,i).join('/').toLowerCase())};
            const addFile=(p,d)=>{const parts=p.split('/');parts.pop();if(parts.length)addDir(parts.join('/'));files.set(p.toLowerCase(),{p,d})};
            const par=k=>k.includes('/')?k.slice(0,k.lastIndexOf('/')):'';
            const base=p=>p.slice(p.lastIndexOf('/')+1);
            const fmt=n=>n.toLocaleString('en-US');

            function playBeep(freq=800, duration=100) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    setTimeout(() => { try { osc.stop(); ctx.close(); } catch(e){} }, duration);
                } catch(e) {}
            }

            const cmds={
                help(a){

                        const targetCmd = a[0].toUpperCase();
                        const doc = getHelpDoc(targetCmd);

                        } else {
                            out(tr('noHelpFor') + `"${targetCmd}".`, 'err');
                        }
                        return;
                    }
                    out(tr('helpHeader'), 'hi');
                    out('');
                    const sortedCmds = Object.keys(helpDocs.en).sort();
                    for(const cmd of sortedCmds) {
                        const doc = getHelpDoc(cmd);
                        const idx = doc.indexOf(' - ');
                        if (idx !== -1) {
                            const left = doc.slice(0, idx);
                            const right = doc.slice(idx + 3);
                            out(left.padEnd(22) + right);
                        } else {
                            out(doc);
                        }
                    }
                    out('');

                config(a){
                    if(!a[0]) return out('Current language: ' + currentLang + ' (english/en, korean/kr, japanese/jp, chinese/cn)', 'hi');
                    const arg = a[0].toLowerCase();
                    if(['en', 'english'].includes(arg)) { currentLang = 'en'; }
                    else if(['kr', 'ko', 'korean'].includes(arg)) { currentLang = 'kr'; }
                    else if(['jp', 'ja', 'japanese'].includes(arg)) { currentLang = 'jp'; }
                    else if(['cn', 'zh', 'chinese'].includes(arg)) { currentLang = 'cn'; }
                    else { return out(tr('invalidLang'), 'err'); }
                    
                    updateUIForLanguage();
                    out(tr('langChanged'), 'ok');
                    prompt();

                call(a){ if(a[0]) out('Calling batch file: ' + a[0]); else out(tr('reqParam'), 'err'); },
                cd(a){
                    if(!a[0]) return out('C:\\' + cwd.join('\\').toUpperCase());
                    let p=resolve(a[0]);
                    if(!dirs.has(lc(p))){   // 현재 위치에 없으면 루트 기준으로도 찾기 (CD B 후 CD A 처럼 드라이브 폴더 이동)
                        const pr=resolve('\\'+a[0]), dm=/^[\\/]?([a-z])[\\/]*$/i.exec(a[0]);
                        if(dirs.has(lc(pr))) p=pr;
                        else if(dm && dm[1].toLowerCase()==='c') return out(ms('C is the system drive. Use A, B, D-Z.', 'C 는 시스템 드라이브입니다. A, B, D~Z 를 사용하세요.'), 'err');
                        else if(dm){ p=[dm[1]]; addDir(p[0]); }   // 없는 A~Z 폴더는 빈 폴더로 생성 (GitHub 폴더용)
                    }
                    if(!dirs.has(lc(p))) return out(tr('invDir'), 'err');
                    cwd=p.map((x,i)=>{const f=[...dirs].find(d=>d===lc(p.slice(0,i+1)));const o=[...files.values()].map(v=>v.p.split('/')).find(s=>s[i]&&s.slice(0,i+1).join('/').toLowerCase()===f);return o?o[i]:x});
                },
                chdir(a){ cmds.cd(a); },
                chcp(a){ if(a[0]) out('Active code page: ' + a[0]); else out('Active code page: 437'); },
                chkdsk(){
                    out(tr('chkdskType'));
                    out(tr('chkdskSerial'));
                    out(tr('chkdskTotal'));
                    out(`${files.size} files taking ${Array.from(files.values()).reduce((a,b)=>a+b.d.length,0)} bytes.`);
                    out(tr('chkdskAvail'));
                },
                chkntfs(){ out('C: is not dirty.'); },
                cls(){ O.innerHTML=''; },
                cmd(){ out('Microsoft Windows DOS Shell [Version 1.06.437]'); },
                color(a){
                    const code = a[0] || '';
                    if(code === '0a' || code === '2') { T.style.color = '#5f5'; out(tr('colorGreen'), 'ok'); }
                    else if(code === '0b' || code === '3') { T.style.color = '#5ff'; out(tr('colorCyan'), 'cyan'); }
                    else if(code === '0e' || code === '6') { T.style.color = '#ff5'; out(tr('colorYellow'), 'yellow'); }
                    else { T.style.color = '#aaa'; out(tr('colorReset')); }
                },
                comp(a){
                    if(!a[0] || !a[1]) return out('Usage: COMP file1 file2', 'err');
                    const f1 = files.get(lc(resolve(a[0]))), f2 = files.get(lc(resolve(a[1])));
                    if(!f1 || !f2) return out(tr('fileNotFound'), 'err');
                    if(f1.d.length !== f2.d.length) return out('Files are of different sizes.');
                    let same = true;
                    for(let i=0; i<f1.d.length; i++){ if(f1.d[i] !== f2.d[i]){ same=false; break; } }
                    out(same ? 'Files compare OK' : 'Compare error at byte offset 0');
                },
                compact(a){ out('All files in directory are uncompressed.'); },
                convert(){ out('Volume C: is already FAT32/VIRTUAL.'); },
                copy(a){
                    if(!a[0] || !a[1]) return out('Usage: COPY source destination', 'err');
                    const srcKey = lc(resolve(a[0]));
                    const src = files.get(srcKey);
                    if(!src) return out(tr('fileNotFound'), 'err');
                    const destPath = resolve(a[1]).join('/');
                    addFile(destPath, new Uint8Array(src.d));
                    out(tr('fileCopied'), 'ok');
                },
                date(){ out('Current date is ' + new Date().toLocaleDateString()); },
                del(a){
                    if(!a[0]) return out(tr('reqParam'), 'err');
                    const f=files.get(lc(resolve(a[0])));
                    if(!f) return out(tr('fileNotFound'), 'err');
                    files.delete(lc(resolve(a[0])));
                    out(tr('fileDeleted'), 'ok');
                },
                erase(a){ cmds.del(a); },
                
                dir(a){
                    const targetPath = a[0] ? resolve(a[0]) : cwd;
                    const k = lc(targetPath);
                    if(!dirs.has(k) && targetPath.length > 0) return out(tr('fileNotFound'), 'err');

                    out(' ' + tr('dirOf') + targetPath.join('\\').toUpperCase());
                    out('');

                    let totalFiles = 0;
                    let totalDirs = 0;
                    let totalSize = 0;

                    for (const d of dirs) {
                        if (d && par(d) === k) {
                            totalDirs++;
                            const folderName = [...files.values()]
                                .map(v => v.p.split('/'))
                                .map(s => s[targetPath.length])
                                .find(x => x && (k ? k + '/' : '') + x.toLowerCase() === d) || base(d);
                            out(folderName.toUpperCase().padEnd(20) + '<DIR>');
                        }
                    }

                    for (const [fk, v] of files) {
                        if (par(fk) === k) {
                            totalFiles++;
                            totalSize += v.d.length;
                            out(base(v.p).toUpperCase().padEnd(20) + fmt(v.d.length).padStart(12));
                        }
                    }

                    const nestedFiles = [...files.values()].filter(v => {
                        const fileKey = v.p.toLowerCase();
                        return fileKey.startsWith(k ? k + '/' : '') && par(fileKey) !== k;
                    });

                    if (nestedFiles.length > 0) {
                        out('');
                        out(tr('subfolderHeader'), 'cyan');
                        for (const v of nestedFiles) {
                            totalFiles++;
                            totalSize += v.d.length;
                            const relPath = k ? v.p.slice(k.length + 1) : v.p;
                            out(relPath.replace(/\//g, '\\').toUpperCase().padEnd(32) + fmt(v.d.length).padStart(12), 'hi');
                        }
                    }

                    out('');
                    out(`  ${totalFiles}${tr('filesBytes')}${fmt(totalSize)}${tr('bytesStr')}`);
                    out(`  ${totalDirs}${tr('dirsStr')}`);
                    out(`  32,768,000${tr('freeSpace')}`);
                },

                    if(!f) return out(tr('fileNotFound'), 'err');

                    out(tr('jsRunning') + f.p.toUpperCase(), 'cyan');

                    const code = new TextDecoder('utf-8').decode(f.d);

                    const customConsole = {
                        log: (...args) => out(args.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(' ')),
                        warn: (...args) => out('[WARN] ' + args.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(' '), 'yellow'),
                        error: (...args) => out('[ERROR] ' + args.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(' '), 'err'),
                        info: (...args) => out(args.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join(' '), 'cyan')
                    };

                        read: (filename) => {
                            const targetKey = lc(resolve(filename));

                            return new TextDecoder('utf-8').decode(targetFile.d);

                    };

            // 폴더 최상위의 zip/jsdos 는 풀어서 내용물로 교체

                    dbg('GET ' + dir + '/ → ' + r.status);

            // 4) 저장소 파일 목록으로 폴더 자동 탐색 (zip 이름이 뭐든 상관없음)

            const treeCache = {};
            async function ghTree(o, rp) {
                const key = o + '/' + rp;
                if (treeCache[key]) return treeCache[key];
                for (const ref of ['HEAD', 'main', 'master', 'gh-pages']) {
                    try {
                        const r = await fetch('https://api.github.com/repos/' + key + '/git/trees/' + ref + '?recursive=1');
                        dbg('API ' + key + '@' + ref + ' → ' + r.status);
                        if (r.ok) {
                            const j = await r.json();
                            if (j.truncated) { dbg('API tree truncated → jsDelivr'); break; }
                            return treeCache[key] = (j.tree || []).filter(t => t.type === 'blob').map(t => t.path);
                        }
                        ghErr = r.status;
                        if (r.status === 404) return null;                 // 저장소가 아님 → 다음 후보
                        if (r.status === 403 || r.status === 429) break;   // 호출 제한 → jsDelivr
                    } catch (e) { ghErr = e.message || e; dbg('API error: ' + ghErr); }
                }
                for (const ep of ['main', 'master', 'gh-pages'].flatMap(ref => [
                        'https://data.jsdelivr.com/v1/packages/gh/' + key + '@' + ref + '?structure=flat',
                        'https://data.jsdelivr.com/v1/package/gh/' + key + '@' + ref + '/flat'])) {
                    const ref = ep;
                    try {
                        const r = await fetch(ep);
                        dbg('jsDelivr ' + key + '@' + ref + ' → ' + r.status);
                        if (!r.ok) continue;
                        const j = await r.json();
                        const arr = (j.files || []).map(f => String(f.name).replace(/^\//, ''));
                        if (arr.length) { ghErr = null; return treeCache[key] = arr; }
                    } catch (e) { dbg('jsDelivr error: ' + (e.message || e)); }
                }
                return null;
            }

            async function srcGithub(letter) {
                const h = location.hostname, segs = location.pathname.split('/').filter(Boolean);
                const isFile = x => /\.[a-z0-9]+$/i.test(x);
                const cands = [];
                if (GH_REPO) {
                    const [o, rp] = GH_REPO.split('/');
                    cands.push({ owner: o, repo: rp, rest: [] });
                } else if (/\.github\.io$/i.test(h)) {
                    const o = h.split('.')[0];
                    if (segs.length && !isFile(segs[0])) cands.push({ owner: o, repo: segs[0], rest: segs.slice(1) });
                    cands.push({ owner: o, repo: h, rest: segs });
                }
                if (!cands.length) dbg('GitHub 저장소를 알 수 없음 → 주소 뒤에 ?gh=owner/repo 를 붙이세요');
                for (const c of cands) {
                    const rest = c.rest.slice();
                    if (rest.length && isFile(rest[rest.length - 1])) rest.pop();
                    const prefix = rest.length ? rest.join('/') + '/' : '';
                    const tree = await ghTree(c.owner, c.repo);
                    if (!tree) continue;
                    const want = (prefix + letter + '/').toLowerCase();
                    const hits = tree.filter(p => p.toLowerCase().startsWith(want) && !skipName(p));
                    dbg('folder match: ' + hits.length + ' file(s)');
                    if (!hits.length) {   // Pages 배포 루트가 docs/ 같은 하위 폴더일 수 있음 → 앞쪽 폴더 무시하고 탐색
                        const re = new RegExp('^((?:[^/]+/){0,3})(' + letter + ')/', 'i');
                        const alt = tree.filter(p => re.test(p) && !skipName(p));
                        dbg('folder match (any depth): ' + alt.length + ' file(s)');
                        if (!alt.length) continue;
                        const m0 = alt[0].match(re), lead = m0[1], dir2 = m0[2];
                        return { dir: dir2, list: alt.filter(p => p.startsWith(lead + dir2 + '/')).map(p => { const rel = p.slice(lead.length + dir2.length + 1); return { path: rel, get: getter(dir2, rel) }; }) };
                    }
                    const dir = hits[0].slice(prefix.length).split('/')[0];
                    return { dir, list: hits.map(p => { const rel = p.slice(prefix.length + dir.length + 1); return { path: rel, get: getter(dir, rel) }; }) };
                }
                return null;
            }

            // ================= LOAD (아무 zip) : 저장소 어디에 있든 zip/jsdos 를 찾아 불러오기 =================
            const ms = (en, kr) => currentLang === 'kr' ? kr : en;
            const ghCands = () => {
                const h = location.hostname, segs = location.pathname.split('/').filter(Boolean);
                const isFile = x => /\.[a-z0-9]+$/i.test(x);
                const raw = [];
                if (GH_REPO) { const [o, rp] = GH_REPO.split('/'); raw.push({ owner: o, repo: rp, rest: [] }); }
                else if (/\.github\.io$/i.test(h)) {
                    const o = h.split('.')[0];
                    if (segs.length && !isFile(segs[0])) raw.push({ owner: o, repo: segs[0], rest: segs.slice(1) });
                    raw.push({ owner: o, repo: h, rest: segs });
                }
                return raw.map(c => { const rest = c.rest.slice(); if (rest.length && isFile(rest[rest.length - 1])) rest.pop(); return { owner: c.owner, repo: c.repo, prefix: rest.length ? rest.join('/') + '/' : '' }; });
            };
            let zipFound = null;
            async function findZips() {
                if (zipFound) return zipFound;
                const res = [], seen = new Set();
                const add = (label, url) => { if (!isZip(label) || skipName(label) || /(^|\/)node_modules\//.test(label) || seen.has(url)) return; seen.add(url); res.push({ path: label, url }); };
                try {   // 페이지와 같은 폴더의 files.json (zip 이름 목록)
                    const r = await fetch(U('files.json'), { cache: 'no-cache' });
                    dbg('GET files.json → ' + r.status);
                    if (r.ok) { const j = await r.json(); (Array.isArray(j) ? j : (j.files || [])).forEach(x => typeof x === 'string' && add(x, U(encPath(x)))); }
                } catch (e) {}
                if (!res.length) for (const c of ghCands()) {
                    const tree = await ghTree(c.owner, c.repo);
                    if (!tree) continue;
                    const pb = pageBase(), repoBase = c.prefix && pb.endsWith(c.prefix) ? pb.slice(0, pb.length - c.prefix.length) : pb;
                    tree.forEach(p => add(c.prefix && p.startsWith(c.prefix) ? p.slice(c.prefix.length) : p,
                        c.prefix && p.startsWith(c.prefix) ? U(encPath(p.slice(c.prefix.length))) : repoBase + encPath(p)));
                    dbg('zip found: ' + res.length);
                    if (res.length) break;
                }
                res.sort((x, y) => x.path.localeCompare(y.path));
                if (res.length) zipFound = res;
                return res;
            }
            // 목록 조회 없이 경로/이름으로 zip 을 직접 찾기 (A/w3d.zip, w3d.zip, w3d → a~z, A~Z 폴더 탐색)
            async function probeZips(spec) {
                const sp = spec.replace(/\\/g, '/').replace(/^\.?\//, '');
                const exts = /\.(zip|jsdos)$/i.test(sp) ? [''] : ['.zip'];
                const cands = new Set();
                for (const n of [...new Set([sp, sp.toLowerCase()])]) for (const e of exts) {
                    if (sp.includes('/')) {
                        const [f, ...r] = n.split('/'), rest = r.join('/') + e;
                        cands.add(n + e); cands.add(f.toUpperCase() + '/' + rest); cands.add(f.toLowerCase() + '/' + rest);
                    } else {
                        cands.add(n + e);
                        for (const c of 'abcdefghijklmnopqrstuvwxyz') { cands.add(c + '/' + n + e); cands.add(c.toUpperCase() + '/' + n + e); }
                    }
                }
                const list = [...cands], hits = [];
                dbg('probe ' + list.length + ' path(s)');
                for (let i = 0; i < list.length && !hits.length; i += 20) {
                    const res = await Promise.all(list.slice(i, i + 20).map(async p => {
                        try {
                            const r = await fetch(U(encPath(p)), { method: 'HEAD', cache: 'no-cache' });
                            if (r.ok && !/html/i.test(r.headers.get('content-type') || '')) return p;
                        } catch (e) {}
                        return null;
                    }));
                    res.filter(Boolean).forEach(p => hits.push({ path: p, url: U(encPath(p)) }));
                }
                dbg('probe hits: ' + hits.length);
                return hits;
            }
            async function loadAny(a) {
                if (location.protocol === 'file:') return out(lm('local'), 'err');
                if (loading) return;
                loading = true; ghErr = null;
                try {
                    const qRaw = a.filter(x => !/^[-\/]/.test(x)).join(' ').trim(), q = qRaw.toLowerCase();
                    out(ms('Searching for zip files...', 'zip 파일 검색 중...'), 'cyan');
                    let direct = [];
                    if (qRaw && !/^(\*|all|\d+|[a-z])$/i.test(qRaw)) direct = await probeZips(qRaw);   // 이름/경로로 직접 탐색
                    let zips = direct.length ? direct : await findZips();
                    if (!zips.length && /^[a-z]$/i.test(qRaw)) {   // 목록 조회 불가 → A/ 폴더의 흔한 이름 추측
                        const nm = ['game', 'games', 'w3d', 'wolf3d', 'wolf', 'doom', 'dos', 'play', 'data', 'files', 'pack', 'main', qRaw.toLowerCase(), qRaw.toUpperCase()];
                        const cand = []; for (const d of [qRaw.toUpperCase(), qRaw.toLowerCase()]) for (const n of nm) { cand.push(d + '/' + n + '.zip'); cand.push(d + '/' + n.toUpperCase() + '.zip'); }
                        const list = [...new Set(cand)];
                        const res = await Promise.all(list.map(async p => { try { const r = await fetch(U(encPath(p)), { method: 'HEAD', cache: 'no-cache' }); return r.ok && !/html/i.test(r.headers.get('content-type') || '') ? p : null; } catch (e) { return null; } }));
                        zips = res.filter(Boolean).map(p => ({ path: p, url: U(encPath(p)) }));
                        dbg('name-guess hits: ' + zips.length);
                    }
                    if (!zips.length) {
                        if (ghErr) out(lm('ghErr', ghErr), 'err');
                        if (ghErr == 403 || ghErr == 429) out('  GitHub API rate limit. Wait a while, or put files.json (e.g. ["game.zip"]) next to this page.', 'yellow');
                        if (!verbose) dbgBuf.slice(-14).forEach(m => out('  ' + m, 'yellow'));
                        if (!ghCands().length) out(ms('Repository unknown. Type  REPO owner/name  (or add ?gh=owner/name to the URL).', '저장소를 알 수 없습니다.  REPO 소유자/저장소  를 입력하거나 주소 뒤에 ?gh=소유자/저장소 를 붙이세요.'), 'yellow');
                        out(ms('Or put files.json in the folder (auto-generated by zip-manifest.yml).', '또는 폴더에 files.json 을 두세요 (zip-manifest.yml 로 자동 생성 가능).'), 'yellow');
                        out(ms('  Tip: type the exact path, e.g.  LOAD A/w3d.zip', '  팁: 정확한 경로로 불러보세요. 예)  LOAD A/w3d.zip'), 'yellow');
                        return out(ms('No zip file found in this repository.', '저장소에서 zip 파일을 찾지 못했습니다.'), 'err');
                    }
                    let pick;
                    const fm = /^[a-z]$/.test(q);
                    if (/^(\*|all)$/.test(q)) pick = zips;
                    else if (!q) pick = zips.length === 1 ? zips : null;
                    else if (fm) pick = zips.filter(z => (z.path.toLowerCase().startsWith(q + '/') || z.path.toLowerCase().includes('/' + q + '/')));   // LOAD A → A/ 폴더의 모든 zip
                    else if (/^\d+$/.test(q)) pick = zips[+q - 1] ? [zips[+q - 1]] : [];
                    else pick = zips.filter(z => z.path.toLowerCase().includes(q));
                    if (!pick || !pick.length || (pick.length !== 1 && !fm && !/^(\*|all)$/.test(q))) {
                        out(ms('Found zip files:', '찾은 zip 파일:'), 'cyan');
                        (pick && pick.length ? pick : zips).forEach(z => out('  ' + String(zips.indexOf(z) + 1).padStart(2) + '  ' + z.path, 'ok'));
                        return out(ms('Use LOAD <number|name>  or  LOAD *  (load all)', '사용법: LOAD <번호|이름>   또는   LOAD *  (전부 불러오기)'), 'yellow');
                    }
                    for (const z of pick) {
                        out(ms('Downloading ', '다운로드 중 ') + z.path + ' ...', 'cyan');
                        try {
                            const r = await fetch(z.url);
                            dbg('GET ' + z.url + ' → ' + r.status);
                            if (!r.ok) throw new Error(r.status);
                            const zip = await JSZip.loadAsync(new Uint8Array(await r.arrayBuffer()));
                            const ents = Object.values(zip.files).filter(e => !e.dir && !skipName(e.name));
                            const tops = new Set(ents.map(e => e.name.split('/')[0]));
                            const strip = tops.size === 1 && ents.every(e => e.name.includes('/'));
                            const root = base(z.path).replace(/\.[^.]+$/, '');
                            const pre = cwd.length ? cwd.join('/') + '/' : '';
                            const sub = (cwd.length && /^[a-z]$/i.test(cwd[0]) && cwd[0].toLowerCase() !== 'c') ? '' : root + '/';
                            let n = 0, bytes = 0;
                            for (const e of ents) {
                                const nm = strip ? e.name.split('/').slice(1).join('/') : e.name;
                                const data = await e.async('uint8array');
                                addFile(pre + sub + nm, data); n++; bytes += data.length;
                            }
                            out('  ' + n + ms(' file(s) loaded (', '개 파일 로드 (') + (bytes / 1048576).toFixed(1) + ' MB) → ' + (pre + sub).replace(/\/$/, '').replace(/\//g, '\\').toUpperCase() + '\\', 'ok');
                        } catch (e) { out('  ' + z.path + ': ' + (e && e.message || e), 'err'); }
                    }
                    out(ms('Done. Use DIR / RUN <file>.EXE', '완료. DIR 로 확인하고 RUN 파일.EXE 로 실행하세요.'), 'ok');
                } catch (e) { out('Error: ' + (e && e.message || e), 'err'); }
                finally { loading = false; }
            }

            cmds.repo = function (a) {   // REPO owner/name : 저장소 지정(저장됨), REPO - : 자동 감지로 되돌리기
                if (a[0]) {
                    GH_REPO = a[0] === '-' ? '' : a[0].replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
                    try { GH_REPO ? localStorage.setItem('webdos_repo', GH_REPO) : localStorage.removeItem('webdos_repo'); } catch (e) {}
                    zipFound = null; for (const k in treeCache) delete treeCache[k];
                }
                out('REPO = ' + (GH_REPO || '(auto)'), 'ok');
            };
            cmds.load = async function (a) {
                verbose = a.some(x => /^[-\/]v$/i.test(x)); dbgBuf.length = 0;
                const flags = a.filter(x => /^[-\/]/.test(x)), fnames = a.filter(x => !/^[-\/]/.test(x));
                const L = (cwd[0] || '').toLowerCase();                 // 현재 위치(CD A)가 불러올 GitHub 폴더
                if (!/^[a-z]$/.test(L) || L === 'c') return out(ms('Enter the folder first:  CD A  then  LOAD', '먼저 폴더로 이동하세요:  CD A  입력 후  LOAD'), 'err');
                a = [fnames.length ? L + '/' + fnames.join(' ').replace(/^"|"$/g, '') : L, ...flags];   // 예: LOAD Street Fighter2.zip
                if (fnames.length) return loadAny(a);   // 이름을 직접 지정 → 목록 조회 없이 바로 요청
                if (L === 'c') return out(lm('reserved'), 'err');
                if (location.protocol === 'file:') return out(lm('local'), 'err');
                if (loading) return;
                loading = true; ghErr = null;
                try {
                    out(lm('loading', L), 'cyan');
                    dbg('base: ' + pageBase());
                    let found = null;
                    for (const d of [L, L.toUpperCase()]) {            // 깃허브는 대소문자 구분 → 둘 다 시도
                        let list = (await srcManifest(d)) || (await srcZipNames(d, L)) || (await srcIndex(d));
                        if (list) { list = await expandZips(list); if (list.length) { found = { dir: d, list }; break; } }
                    }
                    if (!found) {
                        const g = await srcGithub(L);
                        if (g) { const list = await expandZips(g.list); if (list.length) found = { dir: g.dir, list }; }
                    }
                    if (!found) { loading = false; return await loadAny(a); }   // 폴더 방식 실패 → 저장소 전체에서 zip 검색

                    for (const k of [...files.keys()]) if (k.startsWith(L + '/')) files.delete(k);

                    const list = found.list, total = list.length;
                    let idx = 0, done = 0, bytes = 0;
                    out('');
                    const bar = O.lastChild;
                    const worker = async () => {
                        while (idx < total) {
                            const it = list[idx++];
                            const data = await it.get();
                            addFile(L + '/' + it.path, data);
                            bytes += data.length; done++;
                            if (bar) bar.textContent = lm('progress', done, total);
                        }
                    };
                    await Promise.all(Array.from({ length: Math.min(6, total) }, worker));
                    if (bar) bar.remove();

                    out(total + tr('uploadComplete'), 'ok');
                    out('');
                    out(tr('uploadedHeader'), 'cyan');
                    list.forEach(it => out('  ' + (L + '/' + it.path).replace(/\//g, '\\').toUpperCase(), 'ok'));
                    out('');
                } catch (e) {
                    out('Error: ' + (e && e.message || e), 'err');
                } finally { loading = false; }
            };
            // =================================================================================

            $('fz').onchange=e=>{ingest([...e.target.files]);e.target.value=''};
            $('fd').onchange=e=>{ingest([...e.target.files]);e.target.value=''};

            T.ondragover=e=>{e.preventDefault();T.classList.add('drag')};
            T.ondragleave=()=>T.classList.remove('drag');
            T.ondrop=async e=>{
                e.preventDefault(); T.classList.remove('drag');
                const all=[];
                const walk=async(en,path)=>{
                    if(en.isFile) await new Promise(r=>en.file(f=>{Object.defineProperty(f,'webkitRelativePath',{value:path+f.name});all.push(f);r()}));
                    else{const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r));for(const c of b)await walk(c,path+en.name+'\/')}while(b.length)}
                };
                for(const it of e.dataTransfer.items){
                    const en=it.webkitGetAsEntry?.();
                    if(en?.isDirectory) await walk(en,'');
                    else if(en) await new Promise(r=>en.file(f=>{all.push(f);r()}))
                }
                ingest(all);
            };

            I.onkeydown=e=>{
                if(e.key==='Enter'){
                    const l=I.value.trim();
                    out($('pr').textContent+I.value);
                    I.value='';
                    if(l){
                        hist.push(l); hi=hist.length;
                        const [c,...a]=l.split(/\s+/);
                        const dm=/^([a-z]):$/i.exec(c);
                        const fn=cmds[c.toLowerCase()] || (dm ? (dm[1].toLowerCase()==='c' ? (()=>{cwd=[]}) : (()=>cmds.cd(['\\'+dm[1].toUpperCase()]))) : null);   // A: B: D: ... / C: = 루트
                        fn?fn(a):out("'"+c+"'"+tr('notCommand'),'err');
                    }
                    prompt(); T.scrollTop=T.scrollHeight;
                }else if(e.key==='ArrowUp'){
                    if(hi>0) I.value=hist[--hi];
                    e.preventDefault();
                }else if(e.key==='ArrowDown'){
                    I.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'');
                }else if(e.key==='Tab'){
                    e.preventDefault();
                    const val = I.value.trim().toLowerCase();
                    const cmdNames = Object.keys(cmds);
                    const match = cmdNames.find(c => c.startsWith(val));
                    if(match) I.value = match.toUpperCase() + ' ';
                }
            };

            window.addEventListener('keydown', e => {
                if($('editor').style.display === 'flex') {
                    if(e.key === 'Escape') {
                        $('editor').style.display = 'none';
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    } else if((e.ctrlKey || e.metaKey) && e.key === 's') {
                        const content = new TextEncoder().encode($('editor-textarea').value);
                        files.set(editingFile.key, { p: editingFile.path, d: content });
                        $('editor').style.display = 'none';
                        out(tr('editorSaved') + editingFile.path, 'ok');
                        editingFile = null;
                        I.focus();
                        e.preventDefault();
                    }
                } else {
                    if(e.key==='Escape') stopGame();
                }
            });

            window.addEventListener('error', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.message || 'Script warning'), 'err');
                }
            });

            window.addEventListener('unhandledrejection', e => {
                if($('game').style.display === 'block') {
                    out('[WARN] ' + (e.reason && e.reason.message || e.reason), 'err');
                }
            });

            ensureDos().catch(()=>{});
            T.onclick=()=>{if(!getSelection().toString() && $('editor').style.display !== 'flex')I.focus()};

            updateUIForLanguage();
            out(tr('intro1'),'hi');
            out(tr('intro2'));
            out('');
            prompt();
        })();
    </script>
</body>
